name: Build Jarvis Quest APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK components
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools ndk;27.2.12479018 cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify native libraries are packaged
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "Inspecting $APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libjarvis_whisper.so' || (echo "::error::libjarvis_whisper.so missing from APK" && exit 1)
          unzip -l "$APK" | grep 'lib/arm64-v8a/libwhisper.so' || (echo "::error::libwhisper.so missing from APK" && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-quest-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
